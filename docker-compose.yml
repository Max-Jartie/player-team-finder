services:
  db:
    image: postgres:16-alpine
    container_name: player-team-finder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: team_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_finder"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: player-team-finder-backend
    restart: unless-stopped
    environment:
        SECRET_KEY: "change_me_in_production"
        DATABASE_URL: "postgresql://postgres:postgres@db:5432/team_finder"
        CORS_ORIGINS: "http://176.108.254.224,http://localhost:5173,http://127.0.0.1:5173"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: player-team-finder-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: